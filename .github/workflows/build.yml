name: Build and Release IPA

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
    branches: [ "main", "master", "principal" ]

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Build Release Binary
      run: swift build -c release --disable-sandbox

    - name: Package as IPA structure
      run: |
        mkdir -p Payload
        # Pega o binário compilado pelo Swift PM e coloca na estrutura de app do iOS
        BINARY_PATH=$(swift build -c release --show-bin-path)/RatoFilesCore
        
        if [ -f "$BINARY_PATH" ]; then
          # Cria um diretório temporário de .app estruturado
          APP_DIR="Payload/RatoFile.app"
          mkdir -p "$APP_DIR"
          cp "$BINARY_PATH" "$APP_DIR/RatoFile"
          
          # Cria o Info.plist mínimo necessário para a estrutura
          cat << 'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.ratofile.app</string>
              <key>CFBundleName</key>
              <string>RatoFile</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumOSVersion</key>
              <string>12.0</string>
          </dict>
          </dict>
          </plist>
          EOF
          
          zip -r RatoFile.ipa Payload
        else
          echo "Binário compilado não encontrado."
          exit 1
        fi

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RatoFile-IPA
        path: RatoFile.ipa
